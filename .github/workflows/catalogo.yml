# Actualiza docs/catalogo.json (alimentos de Mercadona, Lidl y Carrefour)
# cada lunes, y también a mano desde la pestaña Actions → «Run workflow».
name: Catálogo de alimentos

on:
  schedule:
    - cron: "17 3 * * 1"      # lunes a las 05:17 (hora de Madrid en verano)
  workflow_dispatch:
    inputs:
      solo:
        description: "Tiendas a actualizar (M = Mercadona, L = Lidl, C = Carrefour)"
        default: "MLC"

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Descargar el catálogo
        env:
          SOLO: ${{ github.event.inputs.solo || 'MLC' }}
        run: python3 catalogo/actualizar_catalogo.py --solo "$SOLO"

      - name: Guardar si ha cambiado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalogo.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "catálogo: actualización automática $(date +%F)"
            # Si alguien ha subido algo mientras tanto, se baja lo nuevo, se pone
            # encima el catálogo recién descargado y se vuelve a intentar.
            for i in 1 2 3; do
              git push && exit 0
              cp docs/catalogo.json /tmp/catalogo.json
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
              cp /tmp/catalogo.json docs/catalogo.json
              git add docs/catalogo.json
              git diff --cached --quiet && exit 0
              git commit -m "catálogo: actualización automática $(date +%F)"
            done
            exit 1
          fi
