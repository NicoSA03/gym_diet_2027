# Actualiza docs/catalogo.json (alimentos de Mercadona, Lidl y Carrefour)
# cada lunes, y también a mano desde la pestaña Actions → «Run workflow».
name: Catálogo de alimentos

on:
  schedule:
    - cron: "17 3 * * 1"      # lunes a las 05:17 (hora de Madrid en verano)
  workflow_dispatch:
    inputs:
      solo:
        description: "Tiendas a actualizar (M = Mercadona, L = Lidl, C = Carrefour)"
        default: "MLC"

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar el catálogo
        env:
          SOLO: ${{ github.event.inputs.solo || 'MLC' }}
        run: python3 catalogo/actualizar_catalogo.py --solo "$SOLO"

      - name: Guardar si ha cambiado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalogo.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "catálogo: actualización automática $(date +%F)"
            git push
          fi
